[project]
name = "gemma-gallery"
version = "0.1.0"
description = "Local semantic photo search powered by EmbeddingGemma 2 (FastAPI SSR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "sentence-transformers>=5.0",
    "transformers>=4.56",
    "torch>=2.4",
    "pillow>=10.4",
    "numpy>=1.26",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "httpx2>=2.13.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
